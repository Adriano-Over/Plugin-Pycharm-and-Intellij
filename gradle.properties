pluginGroup=com.floatbar
pluginName=Drawing
pluginVersion=0.1.2

# Compatibility range:
# 252 = JetBrains 2025.2.x, including PyCharm 2025.2.1 build PC-252.25557.130
# 253.* = JetBrains 2025.3.x, keeping the current IntelliJ 2025.3 line supported
pluginSinceBuild=252
pluginUntilBuild=253.*

# Active default IDE target. Set this back to IC when you want Gradle/runIde to default to IntelliJ IDEA again.
platformType=PC
platformVersion=2025.2.1

# Side-by-side development IDEs.
# For 2025.3+, use IU for IntelliJ IDEA and PY for PyCharm.
runIdeIntellijType=IC
runIdeIntellijVersion=2025.2.1
runIdePyCharmType=PC
runIdePyCharmVersion=2025.2.1

javaVersion=21
kotlin.stdlib.default.dependency=false

# Keep Gradle stable while giving the Kotlin compiler enough room for IntelliJ Platform builds.
org.gradle.jvmargs=-Xmx1536m -Xms256m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
kotlin.daemon.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
