name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, package, and verify plugin
        run: .\gradlew.bat test buildPlugin verifyPlugin --stacktrace

      - name: Upload plugin distribution
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: drawing-plugin
          path: build/distributions/*.zip
          if-no-files-found: error
